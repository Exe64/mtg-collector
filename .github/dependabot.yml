# Versions policy: Exe64/infra-vps doc/vps-ovh-apps/politique-versions.md
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and its types only work at the same major.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Odd Node majors are never LTS.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directories: ["/"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
