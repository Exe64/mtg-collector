# Déploiement sur le VPS OVH où Traefik (v3) gère déjà l'ingress 80/443 + Let's Encrypt.
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#
# Variables .env requises :
#   DOMAIN=mtg.mon-domaine.fr
#   TRAEFIK_CERTRESOLVER=letsencrypt   (nom du certresolver dans ton /opt/traefik)
#   COOKIE_SECURE=true                 (servi en HTTPS via Traefik)
#
# Nécessite Docker Compose ≥ 2.24 (directive !reset). Le frontend rejoint le
# réseau Traefik (web_network) ; backend/postgres/redis restent internes.
services:
  frontend:
    ports: !reset []          # plus de port publié : Traefik fait l'entrée
    networks:
      - default               # pour joindre le backend
      - web                   # pour être joignable par Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_network"
      - "traefik.http.routers.mtg.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.mtg.entrypoints=websecure"
      - "traefik.http.routers.mtg.tls=true"
      - "traefik.http.routers.mtg.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.mtg.loadbalancer.server.port=80"

networks:
  web:
    external: true
    name: web_network
