# Override TLS pour l'accès mobile en local (caméra/PWA exigent un secure context).
#
#   1. ./deploy/local-tls.sh <IP_LAN_WINDOWS>   # génère ./certs + installe la CA locale
#   2. docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
#
# Pense à mettre COOKIE_SECURE=true dans .env (on sert désormais en HTTPS).
services:
  frontend:
    ports:
      - '443:443' # s'ajoute au 80:80 de base (qui redirige vers HTTPS)
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
