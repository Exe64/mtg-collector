# Cache : assets fingerprintés par Vite → immuables ; le reste (index.html, service
# worker, manifest) est revalidé à chaque visite pour que les mises à jour arrivent.
# /api/ garde ses propres en-têtes (valeur vide = en-tête non ajouté).
map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  ~^/api/     "";
  default     "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes de sécurité (app exposée publiquement via Traefik)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # CSP modérée : images Scryfall autorisées, styles/scripts inline tolérés (React inline + SW).
  add_header Cache-Control $cache_control always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://*.scryfall.io data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'" always;

  # Compression : le catalogue des commandants pèse ~2,5 Mo en JSON brut (#4)
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json text/css application/javascript image/svg+xml;

  # Reverse-proxy de l'API vers le backend : même origine (#2)
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
